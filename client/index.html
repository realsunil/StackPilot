<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StackPilot</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong colours.
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') === 'light' ? 'light' : 'dark') }
    catch (e) { document.documentElement.setAttribute('data-theme', 'dark') }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- decorative background layers (animated by src/fx.js) -->
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
